<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1F2C7A">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Nexo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Nexo: app plana y minimalista; «Aprender» en una columna móvil de 520 px con navegación inferior,
   «Administrar» con menú lateral plano y tablas limpias. */
:root{
  --bg:#FFFFFF; --surface:#EEEEEE; --surface-2:#E3E3E6; --ink:#313131; --ink-2:#616161; --line:#DADADF; --line-strong:#767676;
  --primary:#1F2C7A; --on-primary:#FFFFFF; --primary-soft:#E6E8F3; --primary-ink:#1F2C7A; --bright:#3B4CC0; --logo:#312783;
  --coral:#FF6A4D; --coral-soft:#FFE8E1; --coral-ink:#B83A1C;
  --sun:#F2A900; --sun-soft:#FFF1CC; --sun-ink:#8A5A00;
  --mint:#2E9E5B; --ok-soft:#DFF1E6; --ok-ink:#1A6B3C; --ok-strong:#1A6B3C; --on-strong:#FFFFFF;
  --warn:#F2A900; --warn-soft:#FFF1CC; --warn-ink:#8A5A00;
  --danger:#D92D20; --danger-soft:#FCE6E4; --danger-ink:#B42318; --danger-strong:#B42318;
  --violet:#6A8695; --violet-soft:#E4ECF0; --violet-ink:#4E6876;
  --on-color:#313131;
  --bar-bg:#313131; --bar-ink:#FFFFFF; --bar-soft:#4A4A4A; --splash-bg:#1F2C7A; --splash-ink:#FFFFFF;
  --scrim:rgba(31,44,122,.45);
  --sc-wall:#E6E8F3; --sc-floor:#DADADF; --sc-steel:#6A8695; --sc-water:#7FB6E8; --sc-box:#F2C14E; --sc-box-2:#E0A93B;
  --f-display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12152B; --surface:#1B2040; --surface-2:#252B52; --ink:#F2F2F2; --ink-2:#B8BCCB; --line:#2E3561; --line-strong:#8A90AE;
  --primary:#9AA6F5; --on-primary:#12152B; --primary-soft:#262E63; --primary-ink:#C3CAFA; --bright:#7D8CF0; --logo:#FFFFFF;
  --coral:#FF7A5E; --coral-soft:#3A231F; --coral-ink:#FF9E85; --sun:#F2B630; --sun-soft:#3A2E12; --sun-ink:#FFC960;
  --mint:#3DBA70; --ok-soft:#16352A; --ok-ink:#6FD39A; --ok-strong:#6FD39A; --on-strong:#12152B; --warn:#F2B630; --warn-soft:#3A2E12; --warn-ink:#FFC960;
  --danger:#F0484D; --danger-soft:#3E1D21; --danger-ink:#FF8F8F; --danger-strong:#FF8F8F; --violet:#7F9DAD; --violet-soft:#22313A; --violet-ink:#A9C1CE;
  --on-color:#12152B; --splash-bg:#1F2C7A; --splash-ink:#FFFFFF; --bar-bg:#070914; --bar-ink:#F2F2F2; --bar-soft:#1B2040; --scrim:rgba(0,0,0,.6);
  --sc-wall:#262E63; --sc-floor:#2E3561; --sc-steel:#8FA6B3; --sc-water:#4A8FCB; --sc-box:#D9A93B; --sc-box-2:#C08A22;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12152B; --surface:#1B2040; --surface-2:#252B52; --ink:#F2F2F2; --ink-2:#B8BCCB; --line:#2E3561; --line-strong:#8A90AE;
  --primary:#9AA6F5; --on-primary:#12152B; --primary-soft:#262E63; --primary-ink:#C3CAFA; --bright:#7D8CF0; --logo:#FFFFFF;
  --coral:#FF7A5E; --coral-soft:#3A231F; --coral-ink:#FF9E85; --sun:#F2B630; --sun-soft:#3A2E12; --sun-ink:#FFC960;
  --mint:#3DBA70; --ok-soft:#16352A; --ok-ink:#6FD39A; --ok-strong:#6FD39A; --on-strong:#12152B; --warn:#F2B630; --warn-soft:#3A2E12; --warn-ink:#FFC960;
  --danger:#F0484D; --danger-soft:#3E1D21; --danger-ink:#FF8F8F; --danger-strong:#FF8F8F; --violet:#7F9DAD; --violet-soft:#22313A; --violet-ink:#A9C1CE;
  --on-color:#12152B; --splash-bg:#1F2C7A; --splash-ink:#FFFFFF; --bar-bg:#070914; --bar-ink:#F2F2F2; --bar-soft:#1B2040; --scrim:rgba(0,0,0,.6);
  --sc-wall:#262E63; --sc-floor:#2E3561; --sc-steel:#8FA6B3; --sc-water:#4A8FCB; --sc-box:#D9A93B; --sc-box-2:#C08A22;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.ic.s{width:16px;height:16px}.ic.l{width:28px;height:28px}.ic.xl{width:40px;height:40px}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:.01em}
.muted{color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ===== Barra del prototipo ===== */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bar-bg)}
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bar-bg);color:var(--bar-ink);color-scheme:dark}
.bar-ctrls{display:contents}
.bar-btn.bar-toggle{display:none}
.bar-who{display:none;font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:8px}
.proto-tag{background:var(--sun);color:#313131;font:800 11px/1 var(--f-body);letter-spacing:.08em;padding:6px 10px;border-radius:99px;white-space:nowrap}
.bar-brand{display:flex;align-items:center;gap:8px;font:800 16px var(--f-display)}
.bar-grp{display:flex;align-items:center;gap:6px;font-size:13px}
.bar-grp label{opacity:.8}
.bar select,#bar select{-webkit-appearance:none;appearance:none;background-color:var(--bar-soft);color:var(--bar-ink);border:0;border-radius:99px;padding:6px 30px 6px 12px;font-size:13px;font-weight:600;max-width:260px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.bar-btn{background:var(--bar-soft);color:var(--bar-ink);border:0;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.bar-btn.hl{background:var(--sun);color:#313131}
.bar-date{font-weight:700;font-variant-numeric:tabular-nums}
.bar-sp{flex:1}

/* ===== Elementos comunes ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:99px;min-height:48px;padding:0 22px;font:700 16px var(--f-body);text-decoration:none;white-space:nowrap}
.btn.block{display:flex;width:100%}
.btn.pri{background:var(--primary);color:var(--on-primary)}
.btn.soft{background:var(--primary-soft);color:var(--primary-ink)}
.btn.ghost{background:transparent;color:var(--primary-ink)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.danger{background:var(--danger-soft);color:var(--danger-ink)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn[disabled]{background:var(--surface-2);color:var(--ink-2);cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 11px 4px 9px;font:700 12.5px/1.25 var(--f-body);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok-ink)}
.chip.warn{background:var(--warn-soft);color:var(--warn-ink)}
.chip.danger{background:var(--danger-soft);color:var(--danger-ink)}
.chip.violet{background:var(--violet-soft);color:var(--violet-ink)}
.chip.primary{background:var(--primary-soft);color:var(--primary-ink)}
.chip.neutral{background:var(--surface-2);color:var(--ink-2)}
.chip.coral{background:var(--coral-soft);color:var(--coral-ink)}
.card{background:var(--surface);border-radius:var(--r-lg);padding:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.tile{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;flex:none;color:var(--on-color)}
.tile.sm{width:40px;height:40px;border-radius:13px}
.t-primary{background:var(--primary);color:var(--on-primary)}.t-coral{background:var(--coral)}.t-sun{background:var(--sun)}.t-violet{background:var(--violet);color:var(--on-primary)}.t-mint{background:var(--bright);color:var(--on-primary)}
.brand-logo{color:var(--logo);display:block;flex:none}
.brand-row{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-weight:700;font-size:13px}
.bar-p{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar-p>i{display:block;height:100%;border-radius:99px;background:var(--primary)}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-weight:700;font-size:14px}
.input,select.input,textarea.input{width:100%;min-height:50px;border:1.5px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);padding:10px 14px;font-size:16px}
textarea.input{min-height:84px;resize:vertical}
.notice{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r-md);padding:12px 14px;font-size:14.5px;line-height:1.45}
.notice.info{background:var(--primary-soft);color:var(--primary-ink)}
.notice.warn{background:var(--warn-soft);color:var(--warn-ink)}
.notice.violet{background:var(--violet-soft);color:var(--violet-ink)}
.notice.ok{background:var(--ok-soft);color:var(--ok-ink)}
.notice.danger{background:var(--danger-soft);color:var(--danger-ink)}
.notice b{color:inherit}
.eyebrow{font:800 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.demo-note{font-size:12.5px;color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== Acceso ===== */
.login{min-height:calc(100vh - 60px);display:grid;place-items:center;padding-block:28px}
.login-card{width:min(440px,100%);display:flex;flex-direction:column;gap:16px}
.brand-lg{display:flex;align-items:center;gap:12px}
.brand-lg b{font:800 30px/1 var(--f-display)}
.demo-accounts{display:flex;flex-wrap:wrap;gap:8px}
.acc-chip{border:0;background:var(--surface-2);border-radius:99px;padding:8px 14px;font-weight:700;font-size:13.5px;text-align:left;line-height:1.25}
.acc-chip small{display:block;font-weight:500;color:var(--ink-2);font-size:12px}
.acc-chip[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary-ink)}

/* ===== Aprender ===== */
.learn{max-width:520px;margin:0 auto;padding-block:16px 104px;display:flex;flex-direction:column;gap:16px}
.lhead{display:flex;align-items:center;gap:12px}
.lhead h1{font-size:26px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--coral);color:var(--on-color);display:grid;place-items:center;font:800 16px var(--f-display);flex:none;border:0}
.salir{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--surface);border-radius:99px;padding:0 14px;min-height:44px;font-weight:700;font-size:14px}
.mode-sw{display:inline-flex;background:var(--surface-2);border-radius:99px;padding:3px}
.mode-sw button{border:0;background:transparent;border-radius:99px;padding:6px 12px;font-weight:700;font-size:13px;color:var(--ink-2)}
.mode-sw button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.hero{background:var(--primary);color:var(--on-primary);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.hero .eyebrow{color:inherit;opacity:.85}
.hero h2{font-size:24px}
.hero .bar-p{background:color-mix(in srgb,var(--on-primary) 25%,transparent)}
.hero .bar-p>i{background:var(--on-primary)}
.hero .btn{background:var(--on-primary);color:var(--primary)}
.hero>*{position:relative}
.hero>.hero-dots{position:absolute;right:-30px;top:-30px;width:104px;height:104px;border-radius:50%;background:var(--coral)}
.hero>.hero-dots::after{content:"";position:absolute;left:-22px;top:66px;width:34px;height:34px;border-radius:10px;background:var(--sun);transform:rotate(18deg)}
.hero .eyebrow,.hero h2{padding-right:64px}
.ccard{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:var(--r-lg);padding:14px;border:0;text-align:left;width:100%}
.ccard .t{font-weight:800;font-size:16px;line-height:1.25}
.ccard .m{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.sec-h h3{font-size:19px}
.lnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);background:var(--surface);display:flex;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:20;border-radius:22px 22px 0 0}
.lnav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;font-size:12.5px;font-weight:700;color:var(--ink-2);border-radius:14px;min-height:56px}
.lnav button[aria-current="page"]{color:var(--primary-ink);background:var(--primary-soft)}
.route{display:flex;flex-direction:column;gap:10px;position:relative;padding-left:30px}
.route::before{content:"";position:absolute;left:13px;top:8px;bottom:8px;width:4px;border-radius:4px;background:var(--surface-2)}
.lvl{font:800 13px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:10px 0 2px -30px;padding-left:30px}
.st{position:relative;display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r-md);padding:12px 14px;border:0;text-align:left;width:100%;min-height:58px}
.st .node{position:absolute;left:-30px;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.st.done .node{background:var(--mint);color:var(--on-color)}
.st.cur{outline:3px solid var(--primary);outline-offset:-3px}
.st.cur .node{background:var(--primary);color:var(--on-primary)}
.st .nm{flex:1;font-weight:700;line-height:1.25}
.st .nm small{display:block;font-weight:500;color:var(--ink-2);font-size:13px}
.st[disabled]{cursor:default}
.st[disabled] .nm{color:var(--ink-2)}
.crit{display:flex;align-items:center;gap:10px;padding:8px 0}
.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}

/* Reproductor */
.player{max-width:560px;margin:0 auto;padding-block:16px 24px;display:flex;flex-direction:column;gap:16px;min-height:calc(100vh - 60px)}
.ptop{display:flex;align-items:center;gap:12px}
.ptop .bar-p{flex:1;height:12px}
.iconbtn{border:0;background:var(--surface);border-radius:50%;width:44px;height:44px;display:grid;place-items:center;flex:none}
.q{font:800 22px/1.3 var(--f-display)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;background:var(--surface);border:2.5px solid transparent;border-radius:var(--r-md);padding:14px 16px;text-align:left;font-weight:600;font-size:16px;min-height:58px;width:100%}
.opt .k{width:30px;height:30px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-weight:800;flex:none}
.opt[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.opt[aria-pressed="true"] .k{background:var(--primary);color:var(--on-primary)}
.opt.good{border-color:var(--mint);background:var(--ok-soft)}
.opt.bad{border-color:var(--danger);background:var(--danger-soft)}
.imgopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.imgopt{background:var(--surface);border:2.5px solid transparent;border-radius:var(--r-md);padding:8px;display:flex;flex-direction:column;gap:6px;font-weight:700;text-align:center}
.imgopt svg{width:100%;height:auto;border-radius:12px;display:block}
.imgopt[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-size:18px;min-height:72px}
.seq{display:flex;flex-direction:column;gap:8px}
.slot{min-height:54px;border:2px dashed var(--line-strong);border-radius:var(--r-md);display:flex;align-items:center;gap:10px;padding:8px 12px;color:var(--ink-2)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pool .opt{width:auto;min-height:48px;font-size:15px}
.scene{background:var(--surface);border-radius:var(--r-md);padding:8px}
.scene svg{width:100%;height:auto;display:block;border-radius:12px;touch-action:manipulation}
.hs-hit{fill:transparent;cursor:pointer}
.hs-hit:focus-visible{outline:none;stroke:var(--primary);stroke-width:4;stroke-dasharray:6 4}
.fb{border-radius:var(--r-lg);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.fb.good{background:var(--ok-soft);color:var(--ok-ink)}
.fb.bad{background:var(--danger-soft);color:var(--danger-ink)}
.fb h3{display:flex;align-items:center;gap:8px;font-size:20px}
.fb p{margin:0;color:var(--ink);font-size:15.5px}
.pfoot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.done-hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:24px}
.big-num{font:800 56px/1 var(--f-display);color:var(--coral-ink)}
.burst{position:relative;width:120px;height:120px}
.burst i{position:absolute;width:16px;height:16px;border-radius:5px;animation:pop 900ms cubic-bezier(.2,.8,.2,1) both}
.burst .core{position:absolute;inset:22px;border-radius:50%;background:var(--mint);display:grid;place-items:center;color:var(--on-color)}
@keyframes pop{from{transform:translate(0,0) scale(.2);opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.burst i{animation:none}}

/* Logros */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{background:var(--surface);border-radius:var(--r-md);padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:12.5px;font-weight:700;line-height:1.25}
.hex{width:54px;height:60px;display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.hex.off{background:var(--surface-2);color:var(--ink-2)}
.rank{display:flex;flex-direction:column}
.rank .r{display:flex;align-items:center;gap:12px;padding:10px 4px;font-weight:600}
.rank .r+.r{border-top:1px solid var(--line)}
.rank .p{width:30px;height:30px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:13px}
.rank .r.me{background:var(--primary-soft);border-radius:14px;color:var(--primary-ink);border-top-color:transparent}
.switch{width:54px;height:32px;border-radius:99px;background:var(--surface-2);border:0;position:relative;flex:none}
.switch::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:var(--ink-2);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]::after{transform:translateX(22px);background:var(--on-primary)}

/* ===== Administrar ===== */
.adm{display:grid;grid-template-columns:232px minmax(0,1fr);gap:0;min-height:calc(100vh - var(--bar-h,52px))}
.side{background:var(--surface);padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--bar-h,52px));align-self:start;height:calc(100vh - var(--bar-h,52px));overflow:auto}
.side .who{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.side .who b{display:block;font-size:14px;line-height:1.2}
.side .who small{color:var(--ink-2);font-size:12px}
.side .g{font:800 11px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin:14px 10px 4px}
.navb{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:12px;padding:9px 10px;font-weight:600;font-size:14px;text-align:left;width:100%}
.navb[aria-current="page"]{background:var(--primary-soft);color:var(--primary-ink);font-weight:800}
.amain{padding-block:22px 48px;min-width:0;display:flex;flex-direction:column;gap:16px}
.atop{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.atop h1{font-size:28px;flex:1;min-width:220px}
.scope{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.scope .chip{font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpis.six{grid-template-columns:repeat(6,minmax(0,1fr))}
.kpis.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--surface);border-radius:var(--r-lg);padding:16px}
.kpi .l{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.kpi .v{font:800 34px/1.1 var(--f-display);margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.kpi.main{background:var(--primary);color:var(--on-primary)}
.kpi.main .l,.kpi.main .d{color:inherit;opacity:.85}
.v-ok{color:var(--ok-ink)}.v-warn{color:var(--warn-ink)}.v-danger{color:var(--danger-ink)}.v-violet{color:var(--violet-ink)}
.panel{background:var(--surface);border-radius:var(--r-lg);overflow:hidden;min-width:0}
.panel>.ph{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:14px 18px;font:800 16px var(--f-display)}
.panel>.ph .sp{flex:1}
.panel>.pb{padding:0 18px 16px}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.t th{text-align:left;font-weight:700;font-size:12px;color:var(--ink-2);padding:10px 12px;background:var(--surface-2);white-space:nowrap}
table.t td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
table.t td.r,table.t th.r{text-align:right}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--bg)}
table.t tfoot td{font-weight:800;background:var(--surface-2)}
.hbar{display:flex;align-items:center;gap:8px;min-width:160px}
.hbar .bar-p{flex:1;height:8px}
.cell{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.cell small{font-size:11.5px;color:var(--ink-2)}
.cols2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:0;background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:700;font-size:14px;color:var(--ink-2)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.filters .field{min-width:160px}
.filters .input{min-height:42px;font-size:14px;padding:8px 12px}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.steps span{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:var(--surface);font-weight:700;font-size:13.5px;color:var(--ink-2)}
.steps span.on{background:var(--primary);color:var(--on-primary)}
.steps span.done{background:var(--ok-soft);color:var(--ok-ink)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.ck{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer}
.ck input{width:18px;height:18px;accent-color:var(--primary)}
.vrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 0;border-top:1px solid var(--line)}
.vrow .grow{min-width:220px}
.seg{display:inline-flex;gap:6px;flex-wrap:wrap}
.seg button{border:0;border-radius:99px;min-height:44px;padding:0 16px;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.seg button[aria-pressed="true"].y{background:var(--ok-strong);color:var(--on-strong)}
.seg button[aria-pressed="true"].n{background:var(--danger-strong);color:var(--on-strong)}
.seg button[aria-pressed="true"].na{background:var(--ink);color:var(--bg)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:36px 18px}
.empty .shape{width:72px;height:72px;border-radius:22px;background:var(--sun);display:grid;place-items:center;color:#313131;transform:rotate(-8deg)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.tl li{display:flex;gap:12px}
.tl .d{width:12px;height:12px;border-radius:50%;background:var(--surface-2);margin-top:5px;flex:none}
.tl li.cur .d{background:var(--primary)}

/* Superposiciones */
#ov:empty{display:none}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border-radius:var(--r-lg);width:min(560px,100%);max-height:100%;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.dialog.wide{width:min(860px,100%)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);z-index:60;overflow:auto;padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 20px 20px;display:flex;flex-direction:column;gap:14px}
.gstep{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:var(--r-md);background:var(--bg)}
.gstep .n{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:var(--surface-2);flex:none}
.gstep.ok .n{background:var(--mint);color:var(--on-color)}
.gstep.next{outline:2.5px solid var(--primary)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:99px;font-weight:700;z-index:70;max-width:calc(100% - 32px);text-align:center}
.cert{background:#FFFFFF;color:#313131;border-radius:12px;padding:28px 30px;position:relative;overflow:hidden;font-family:var(--f-body)}
.cert .wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font:800 38px var(--f-display);color:rgba(255,106,77,.13);transform:rotate(-28deg);white-space:nowrap}
.cert .top{display:flex;justify-content:space-between;gap:10px;border-bottom:3px solid #1F2C7A;padding-bottom:12px;flex-wrap:wrap}
.cert h3{font-size:26px;text-align:center;margin-top:22px}
.cert .who{text-align:center;font:800 24px var(--f-display);margin:8px 0}
.cert .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 24px;margin:18px 0;font-size:13.5px}
.cert .fields span{display:block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#616161}
.cert .ph{border:1.5px dashed #767676;border-radius:10px;display:grid;place-items:center;text-align:center;color:#616161;font-size:12px;padding:12px;min-height:70px}
.cert .legal{font-size:11px;color:#616161;border-top:1px solid #DADADF;padding-top:10px;margin-top:16px}

/* Animación de entrada */
#splash{position:fixed;inset:0;z-index:100;background:var(--splash-bg);color:var(--splash-ink);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));cursor:pointer;animation:nxOut .45s ease-in 2.2s forwards}
#splash .sp-in{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
#splash .sp-mark{width:116px;height:116px;animation:nxMark .6s cubic-bezier(.2,.9,.3,1.25) both}
#splash .sp-mark rect{fill:var(--splash-ink)}
#splash .sp-node{fill:var(--splash-bg);transform-origin:15px 34px;animation:nxPop .3s cubic-bezier(.2,.9,.3,1.4) .3s both}
#splash .sp-n{fill:none;stroke:var(--splash-bg);stroke-width:4.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:nxDraw .6s ease-out .4s forwards}
#splash .sp-dot{fill:var(--coral);transform-origin:33px 14px;animation:nxPop .4s cubic-bezier(.2,.9,.3,1.5) .95s both}
#splash .sp-word{font:800 56px/1 var(--f-display);letter-spacing:-.02em;margin-top:8px;animation:nxRise .5s ease-out 1s both}
#splash .sp-tag{font-weight:600;font-size:16px;opacity:.9;animation:nxRise .5s ease-out 1.15s both}
#splash .sp-corp{width:150px;height:56px;color:var(--splash-ink);margin-top:26px;animation:nxRise .6s ease-out 1.3s both}
#splash .sp-skip{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));background:transparent;color:var(--splash-ink);border:1.5px solid color-mix(in srgb,var(--splash-ink) 45%,transparent);border-radius:99px;padding:8px 16px;font-weight:700}
@keyframes nxMark{from{transform:scale(.4) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
@keyframes nxDraw{to{stroke-dashoffset:0}}
@keyframes nxPop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes nxRise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes nxOut{to{opacity:0;transform:scale(1.05);visibility:hidden}}
@media (prefers-reduced-motion: reduce){#splash{display:none}}
.side-brand{display:flex;align-items:center;gap:10px;padding:2px 8px 14px;font:800 20px var(--f-display)}
.side-corp{margin-top:auto;padding:14px 8px 4px;display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:var(--ink-2)}
@media (max-width:1380px){.cols2.dash{grid-template-columns:minmax(0,1fr)}.kpis.six{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){
  .bar-ctrls{display:none;width:100%;flex-wrap:wrap;align-items:center;gap:8px}
  .bar-ctrls.open{display:flex}
  .bar-btn.bar-toggle{display:inline-flex;margin-left:auto}
  .bar-who{display:block;flex:1 1 100%;order:3}
  .bar-in{padding-block:6px}
  .proto-tag{font-size:10px;padding:5px 8px}
}
@media (max-width:900px){
  .adm{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px 12px;gap:6px}
  .side .who,.side .g{display:none}
  .navb{width:auto;white-space:nowrap;background:var(--surface-2)}
  .cols2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:480px){.lhead .tile{display:none}.lhead h1{font-size:22px}}
@media (max-width:560px){
  .kpis.six,.kpis.four{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bar-brand span{display:none}
  .atop h1{font-size:24px}
  .kpi .v{font-size:28px}
}
/* ===== Nexo conectado: carga, acceso e interacción ===== */
html.ocupado body::before{content:"";position:fixed;top:0;left:0;height:3px;width:35%;background:var(--coral);z-index:100;animation:carga 1s ease-in-out infinite}
html.ocupado [data-act],html.ocupado button[type=submit]{cursor:progress}
@keyframes carga{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
.cargando{display:flex;flex-direction:column;align-items:center;gap:10px;font:800 22px var(--f-display)}
.cargando .muted{font:500 15px var(--f-body)}
.sk{display:flex;gap:8px;margin-top:8px}.sk i{width:10px;height:10px;border-radius:50%;background:var(--primary);animation:pulso 1s ease-in-out infinite}.sk i:nth-child(2){animation-delay:.15s}.sk i:nth-child(3){animation-delay:.3s}
@keyframes pulso{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.emp-chip{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:var(--primary-soft);color:var(--primary-ink);border-radius:99px;padding:8px 14px;font-weight:700;font-size:14px}
.pass{position:relative;display:block}.pass .input{padding-right:52px}.pass .iconbtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent}
.ck.dev{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r-md);padding:12px 14px;background:var(--surface)}
.ck.dev small{display:block;color:var(--ink-2);font-weight:500;font-size:13px;margin-top:2px}
.linkcard{display:flex;gap:12px;align-items:center;border:0;text-align:left;width:100%;font:inherit;color:inherit}
.linkcard .muted{display:block;font-size:14px}
button.linkcard{cursor:pointer}button.linkcard:hover{background:var(--surface-2)}
.tip{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink-2);background:var(--sun-soft);border-radius:var(--r-md);padding:10px 12px}
.medidor{display:flex;align-items:center;gap:10px;margin-top:-6px}.medidor span{display:flex;gap:4px}.medidor span i{width:34px;height:6px;border-radius:99px;background:var(--surface-2)}
.medidor small{font-size:13px;color:var(--ink-2);font-weight:600}
.medidor.n1 span i:nth-child(1){background:var(--sun)}.medidor.n2 span i:nth-child(-n+2){background:var(--mint)}.medidor.n3 span i{background:var(--mint)}
.code-in{letter-spacing:.12em;text-transform:uppercase;font-size:20px}
.demo-pill{background:var(--coral-soft);color:var(--coral-ink);font:800 10.5px/1 var(--f-body);letter-spacing:.08em;padding:6px 8px;border-radius:99px}
.ring-w{position:relative;display:grid;place-items:center;flex:none}.ring-w b{position:absolute;font-size:11.5px;font-variant-numeric:tabular-nums}
.ring .ring-v{transition:stroke-dashoffset .6s ease}
#app.anim .ring .ring-v{animation:anillo 1s ease-out}
@keyframes anillo{from{stroke-dashoffset:var(--c)}}
.resumen{display:flex;gap:16px;align-items:center}
.camino .st{margin-left:var(--x,0px);width:calc(100% - var(--x,0px));transition:transform .15s}
.camino .st:not([disabled]):hover{transform:translateX(3px)}
.camino::before{display:none}
.st.cur .node{animation:latido 1.6s ease-in-out infinite}
@keyframes latido{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--primary) 45%,transparent)}50%{box-shadow:0 0 0 8px transparent}}
#app.anim .ccard,#app.anim .st,#app.anim .kpi,#app.anim .card,#app.anim .panel{animation:aparece .45s ease-out both}
#app.anim .ccard:nth-child(2),#app.anim .st:nth-of-type(2){animation-delay:.05s}#app.anim .ccard:nth-child(3),#app.anim .st:nth-of-type(3){animation-delay:.1s}#app.anim .ccard:nth-child(4),#app.anim .st:nth-of-type(4){animation-delay:.15s}
@keyframes aparece{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#app.anim .bar-p>i{transform-origin:left;animation:crecer .8s ease-out}
@keyframes crecer{from{transform:scaleX(0)}}
.bar-p>i{transition:width .45s ease}
.pts-chip{position:relative;display:inline-flex;align-items:center;gap:4px;background:var(--sun-soft);color:var(--sun-ink);border-radius:99px;padding:6px 10px;font-size:14px}
.flot{position:absolute;left:50%;top:-4px;font-style:normal;font-weight:800;color:var(--mint);animation:flota .9s ease-out forwards;pointer-events:none}
@keyframes flota{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-34px)}}
.racha{animation:salta .4s ease-out;vertical-align:middle;margin-left:6px}
@keyframes salta{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.shake{animation:sacude .4s ease-in-out}
@keyframes sacude{0%,100%{transform:none}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.fb.entra{animation:sube .3s ease-out}
@keyframes sube{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.opt:not([disabled]):active,.imgopt:not([disabled]):active,.btn:not([disabled]):active,.ccard:active{transform:scale(.98)}
.opt,.imgopt,.btn,.ccard{transition:transform .08s,background .15s,border-color .15s}
.big-num.cuenta{animation:salta .5s ease-out}
.tour{text-align:center;align-items:center}
.tour-ill .tile{width:96px;height:96px;border-radius:30px;margin:6px auto 4px;animation:salta .5s ease-out}
.tour .row{width:100%}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:8px;height:8px;border-radius:99px;background:var(--surface-2);transition:width .2s}.dots i.on{width:24px;background:var(--primary)}
.buscar{width:min(560px,100%);gap:10px}
.input.big{font-size:18px;min-height:56px}
.res{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;border-radius:14px;padding:8px 10px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.res:hover,.res:focus-visible{background:var(--surface)}.res small{display:block;font-size:12.5px}.res .avatar{width:36px;height:36px;font-size:13px}
.buscarb{background:var(--bg)!important;margin-bottom:6px}.buscarb kbd,.navb kbd{margin-left:auto;font:600 11px var(--f-mono);background:var(--surface-2);border-radius:6px;padding:2px 6px;color:var(--ink-2)}
button.kpi{border:0;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.kpi.click{transition:transform .15s,box-shadow .15s}.kpi.click:hover{transform:translateY(-2px);box-shadow:0 6px 18px color-mix(in srgb,var(--ink) 12%,transparent)}
.kpi.click .l{display:flex;align-items:center;justify-content:space-between}
.kpi.conanillo{display:flex;gap:14px;align-items:center}
.kpi.conanillo .ring circle:first-child{stroke:color-mix(in srgb,var(--on-primary) 25%,transparent)}
.chip.refresh{border:0;cursor:pointer;font:700 12.5px/1.25 var(--f-body)}.chip.refresh:hover{background:var(--line)}
.rbar{display:block;height:5px;border-radius:99px;background:var(--surface-2);margin-top:5px;overflow:hidden}.rbar i{display:block;height:100%;background:var(--coral);border-radius:99px}
.ficha{border:2px dashed var(--line-strong);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.ficha .codigo{font-size:34px;font-weight:600;letter-spacing:.12em;text-align:center;background:var(--surface);border-radius:var(--r-md);padding:14px}
.toast{display:flex;align-items:center;gap:8px}
.toast.ok{background:var(--ok-strong);color:var(--on-strong)}
.toast.error{background:var(--danger-strong,var(--danger));color:var(--on-strong)}
@media (hover:none){.atajos{display:none}}
@media print{html.imprimiendo-ficha body *{visibility:hidden}html.imprimiendo-ficha .ficha,html.imprimiendo-ficha .ficha *{visibility:visible}html.imprimiendo-ficha .ficha{position:fixed;inset:0 auto auto 0;width:100%}.noprint{display:none!important}}
@media (prefers-reduced-motion: reduce){#app.anim *,.flot,.racha,.shake,.fb.entra,.st.cur .node,.tour-ill .tile,.big-num.cuenta{animation:none!important}.camino .st,.bar-p>i,.ring .ring-v{transition:none}}
